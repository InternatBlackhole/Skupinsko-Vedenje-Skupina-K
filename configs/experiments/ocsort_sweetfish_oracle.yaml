# OC-SORT on SweetFish with corrupted ground-truth boxes as detections
# (no detector yet). Noise / misses make association non-trivial.
dataset: sweetfish
split: val_half
detections:
  source: gt_oracle
  position_noise: 0.05
  size_noise: 0.05
  drop_rate: 0.1
  score: 0.9
  seed: 0
tracker:
  name: ocsort
  config: default
  motion: kf_cv_xysr
  overrides: {}
runner:
  skip_empty_frames: false
  interpolation: null      # e.g. {n_min: 30, n_dti: 20} for the official offline post-processing
evaluate: true
